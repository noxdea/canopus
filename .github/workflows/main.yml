name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake demo
      - run: git diff --exit-code -- docs/media
      - run: bundle exec rake demo
      - run: git diff --exit-code -- docs/media
      - name: Check media budget
        shell: bash
        run: |
          for file in docs/media/*.png docs/media/*.apng; do
            test "$(stat -c%s "$file")" -le 524288
          done
          for file in docs/media/*.cast; do
            test "$(stat -c%s "$file")" -le 102400
          done

  test:
    env:
      BUNDLE_PATH: .bundle/gems
      BUNDLE_VERSION: system
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        ruby: ['3.2', '3.3', '3.4', '4.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: default
      - run: bundle install
      - run: bundle exec rake test
      - run: bundle exec ruby tools/package_signature_test.rb
      - run: bundle exec ruby tools/update_test.rb
      - run: bundle exec rbs -I sig -r kochab -r porrima -r thuban -r alhena -r antares -r denebola -r zaniah -r sadr -r saiph -r megrez -r tarazed -r alkaid -r stringio -r strscan validate
      - run: bundle exec ruby test/type/check.rb
      - run: bundle exec ruby tools/check_dependencies.rb test/type/smoke.rb
      - name: Software full-frame allocation regression guard
        if: runner.os == 'Linux' && matrix.ruby == '4.0'
        run: bundle exec ruby --yjit bench/frame_profile.rb --headless --frames 3 --max-allocations 2000000 --output frame-regression.json
      - run: gem build --strict canopus.gemspec
